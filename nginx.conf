# Nginx Configuration for Site 4 - Northbridge Business Services
# paleon-lab-sme.co.uk

# IMPORTANT: This configuration intentionally omits security headers
# for testing purposes. DO NOT use in production.
# Requires libnginx-mod-http-headers-more package for more_set_headers directive.
# On Ubuntu 24.04 LTS, installing the package auto-creates a load_module entry
# in /etc/nginx/modules-enabled/. If the module is not loaded, add:
#   load_module modules/ngx_http_headers_more_filter_module.so;
# at the top of /etc/nginx/nginx.conf (before any server blocks).

server {
    listen 80;
    listen [::]:80;
    server_name paleon-lab-sme.co.uk www.paleon-lab-sme.co.uk;

    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paleon-lab-sme.co.uk www.paleon-lab-sme.co.uk;

    root /var/www/paleon-lab-sme;
    index index.html;

    # SSL Certificate Configuration
    # Self-signed certificate with expired date
    ssl_certificate /etc/ssl/certs/paleon-lab-sme.crt;
    ssl_certificate_key /etc/ssl/private/paleon-lab-sme.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # INTENTIONALLY MISSING SECURITY HEADERS (for testing)
    # Strict-Transport-Security: OMITTED
    # Content-Security-Policy: OMITTED

    # Standard headers that should remain
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # INTENTIONALLY EXPOSE OUTDATED SERVER VERSION (for testing)
    # Requires: apt install libnginx-mod-http-headers-more
    # This overrides the default Server header with an old version
    more_set_headers 'Server: nginx/1.14.0';

    # Access and error logs
    access_log /var/log/nginx/paleon-lab-sme-access.log;
    error_log /var/log/nginx/paleon-lab-sme-error.log;

    # Clean URL handling - serve index.html from directories
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Explicitly handle root
    location = / {
        try_files /index.html =404;
    }

    # INTENTIONALLY ALLOW ACCESS to backup.bak (for testing)
    location = /backup.bak {
        # This file is intentionally exposed for scanner testing
        # Contains only fake data
        types { } default_type "application/octet-stream";
    }

    # Static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security: Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Custom error pages (optional)
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}

# Old subdomain configuration
server {
    listen 80;
    listen [::]:80;
    server_name old.paleon-lab-sme.co.uk;

    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name old.paleon-lab-sme.co.uk;

    root /var/www/paleon-lab-sme-old;
    index index.html;

    # Use same SSL certificate
    ssl_certificate /etc/ssl/certs/paleon-lab-sme.crt;
    ssl_certificate_key /etc/ssl/private/paleon-lab-sme.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Also intentionally missing security headers
    add_header X-Content-Type-Options "nosniff" always;

    # Also expose outdated server version
    more_set_headers 'Server: nginx/1.14.0';

    access_log /var/log/nginx/paleon-lab-sme-old-access.log;
    error_log /var/log/nginx/paleon-lab-sme-old-error.log;

    location / {
        try_files $uri $uri/index.html =404;
    }
}
