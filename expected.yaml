site: paleon-lab-sme.co.uk
sector: sme
description: Fictional UK SME test site with ten intentional externally observable weaknesses covering TLS, security headers, DNS email posture, exposed network service, backup-file disclosure, outdated version disclosure, and legacy subdomain discovery.
reset: null

detections:
  - id: finding-001
    category: tls
    target: paleon-lab-sme.co.uk
    expect:
      certificate_expired: true
      detection_method: TLS handshake inspection
    severity: high
    claim: observed

  - id: finding-002
    category: security_headers
    target: paleon-lab-sme.co.uk
    expect:
      header_missing: Strict-Transport-Security
    severity: medium
    claim: observed

  - id: finding-003
    category: security_headers
    target: paleon-lab-sme.co.uk
    expect:
      header_missing: Content-Security-Policy
    severity: medium
    claim: observed

  - id: finding-004
    category: dns_email
    target: paleon-lab-sme.co.uk
    expect:
      spf_qualifier: '~all'
      record: 'v=spf1 include:_spf.google.com ~all'
    severity: medium
    claim: observed

  - id: finding-005
    category: dns_email
    target: paleon-lab-sme.co.uk
    expect:
      dmarc_policy: p=none
      record: 'v=DMARC1; p=none; rua=mailto:dmarc@paleon-lab-sme.co.uk'
    severity: medium
    claim: observed

  - id: finding-006
    category: dns_security
    target: paleon-lab-sme.co.uk
    expect:
      dnssec: disabled
    severity: low
    claim: observed

  - id: finding-007
    category: open_ports
    target: paleon-lab-sme.co.uk
    expect:
      port: 3389
      protocol: tcp
      state: open
      service_confirmation: false
      listener_type: dummy
    severity: high
    claim: observed

  - id: finding-008
    category: exposed_files
    target: paleon-lab-sme.co.uk
    expect:
      path: /backup.bak
      status: 200
      synthetic_data_only: true
    severity: medium
    claim: observed

  - id: finding-009
    category: outdated_software
    target: paleon-lab-sme.co.uk
    expect:
      header: Server
      value: nginx/1.14.0
      classification: outdated_component_indicator
    severity: medium
    claim: inferred

  - id: finding-010
    category: subdomain_discovery
    target: old.paleon-lab-sme.co.uk
    expect:
      dns_resolves: true
      https_reachable: true
      legacy_content: true
    severity: low
    claim: observed

must_not_flag:
  - category: confirmed_rdp_service
    target: paleon-lab-sme.co.uk
    reason: Port 3389 is a dummy TCP listener and does not implement RDP.

  - category: confirmed_cve_exploitation
    target: paleon-lab-sme.co.uk
    reason: nginx/1.14.0 is a disclosed outdated version only; no exploitation occurs.

  - category: real_credentials
    target: paleon-lab-sme.co.uk
    reason: backup.bak contains fictional test data only.

  - category: production_data
    target: paleon-lab-sme.co.uk
    reason: All company information and data are fictional.

  - category: exploitation_required
    target: paleon-lab-sme.co.uk
    reason: The fixture is designed to be validated by observation only; no exploit or state-changing action is required.

cyber_essentials_failures:
  - control: Secure Configuration
    finding_ids:
      - finding-002
      - finding-003
      - finding-009

  - control: Access Control
    finding_ids:
      - finding-007

  - control: Malware Protection
    finding_ids:
      - finding-004
      - finding-005

validation:
  tls_protocols:
    - TLSv1.2
    - TLSv1.3

  http_redirect: 301_to_https

  security_headers_missing:
    - Strict-Transport-Security
    - Content-Security-Policy

  exposed_file: /backup.bak
  public_test_port: 3389
  legacy_host: old.paleon-lab-sme.co.uk